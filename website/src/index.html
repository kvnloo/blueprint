    <style>
      body {
        background-color: #050505;

      .perspective-1000 {

      .glass-card {

      /* Living Ruins wallpaper: static poster (LCP, works without JS) and the
         readability veil. The WebGL layer (z -12) slots between them. The crop
         matches src/lib/wallpaper/view.ts coverView(): object-position P plus
         scale(1.07) about P. */
      #wallpaper-poster img {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -20;
        object-fit: cover;
        object-position: 50% 50%;
        transform: scale(1.07);
        transform-origin: 50% 50%;
        pointer-events: none;
        user-select: none;
      }
      @media (max-width: 768px) {
        /* higher specificity: this block sits above the base veil rule */
        /* Light touch on phones: the hero copy carries its own soft backing
           (.hero-copy in Hero.tsx), so the plate keeps its colour. */
        html #wallpaper-veil {
          background:
            linear-gradient(180deg, rgba(6, 8, 10, 0.62) 0px, rgba(6, 8, 10, 0) 120px),
            linear-gradient(0deg, rgba(6, 8, 10, 0.55) 0%, rgba(6, 8, 10, 0) 30%),
            linear-gradient(180deg, rgba(6, 8, 10, 0.18) 0%, rgba(6, 8, 10, 0.12) 100%);
        }
      }
      @media (max-aspect-ratio: 1/1) {
        #wallpaper-poster img {
          object-position: 47% 92%;
          transform-origin: 47% 92%;
        }
      }
      #wallpaper-veil {
        position: fixed;
        inset: 0;
        z-index: -9;
        pointer-events: none;
        /* Left-weighted: dark only behind the text column (0-55% of the width),
           ~10% over the scene on the right, plus a header band and a bottom
           vignette. Black at alpha a is a neutral multiply by (1 - a), so hue and
           saturation survive; no uniform scrim over the whole plate. */
        background:
          linear-gradient(180deg, rgba(6, 8, 10, 0.6) 0px, rgba(6, 8, 10, 0) 140px),
          linear-gradient(0deg, rgba(6, 8, 10, 0.6) 0%, rgba(6, 8, 10, 0.2) 16%, rgba(6, 8, 10, 0) 32%),
          linear-gradient(90deg, rgba(6, 8, 10, 0.74) 0%, rgba(6, 8, 10, 0.66) 30%, rgba(6, 8, 10, 0.5) 45%, rgba(6, 8, 10, 0.26) 56%, rgba(6, 8, 10, 0.1) 70%);
        transition: opacity 0.6s ease;
      }
    </style>
