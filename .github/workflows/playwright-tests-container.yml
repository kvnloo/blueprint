name: Playwright E2E Tests (Container)

on:
  push:
    branches: [main, dev, feature/*, fix/*, enhancement/*]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    name: Playwright Tests (Container)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-jammy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            website/package-lock.json
            website/src/package-lock.json

      - name: Install test dependencies
        run: npm ci
        working-directory: website

      - name: Install app dependencies
        run: npm ci
        working-directory: website/src

      - name: Build application
        run: npm run build
        working-directory: website/src

      - name: Run Playwright tests
        run: npx playwright test --config=tests/playwright.config.ts
        working-directory: website
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          HOME: /root

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: website/tests/playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: website/tests/test-results/
          retention-days: 7

  # Container + Sharding for maximum performance
  test-sharded:
    name: Playwright (${{ matrix.browser }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-jammy
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            website/package-lock.json
            website/src/package-lock.json

      - name: Install test dependencies
        run: npm ci
        working-directory: website

      - name: Install app dependencies
        run: npm ci
        working-directory: website/src

      - name: Build application
        run: npm run build
        working-directory: website/src

      - name: Run Playwright tests (sharded)
        run: npx playwright test --config=tests/playwright.config.ts --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/4 --reporter=blob
        working-directory: website
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          HOME: /root

      - name: Upload blob report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: website/blob-report/
          retention-days: 1

  merge-reports:
    name: Merge Test Reports
    needs: test-sharded
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-jammy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports
        working-directory: website
        env:
          HOME: /root

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-sharded
          path: website/playwright-report/
          retention-days: 30
