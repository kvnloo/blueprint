name: Playwright E2E Tests (Smart)

on:
  push:
    branches: [main, dev, feature/*, fix/*, enhancement/*]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run tests even if no code changes'
        required: false
        default: 'false'
        type: boolean

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      should_test: ${{ steps.filter.outputs.code == 'true' || github.event.inputs.force_run == 'true' || github.event_name == 'workflow_dispatch' }}
      code: ${{ steps.filter.outputs.code }}
      tests: ${{ steps.filter.outputs.tests }}
      config: ${{ steps.filter.outputs.config }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for code changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'website/src/**/*.{ts,tsx,js,jsx,css,scss}'
              - 'website/src/package.json'
              - 'website/src/package-lock.json'
            tests:
              - 'website/tests/**'
              - 'website/package.json'
            config:
              - 'website/tests/playwright.config.ts'
              - '.github/workflows/playwright-*.yml'

  test:
    name: Playwright Tests
    needs: changes
    if: needs.changes.outputs.should_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            website/package-lock.json
            website/src/package-lock.json

      - name: Install test dependencies
        run: npm ci
        working-directory: website

      - name: Install app dependencies
        run: npm ci
        working-directory: website/src

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version // .devDependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT
        working-directory: website

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: website

      - name: Install Playwright dependencies (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit
        working-directory: website

      - name: Build application
        run: npm run build
        working-directory: website/src

      - name: Run Playwright tests
        run: npx playwright test --config=tests/playwright.config.ts
        working-directory: website
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: website/tests/playwright-report/
          retention-days: 30

  skip-notification:
    name: Tests Skipped
    needs: changes
    if: needs.changes.outputs.should_test != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Log skip reason
        run: |
          echo "## ⏭️ Playwright Tests Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No code changes detected that require E2E testing." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Changed paths:**" >> $GITHUB_STEP_SUMMARY
          echo "- Code files: ${{ needs.changes.outputs.code }}" >> $GITHUB_STEP_SUMMARY
          echo "- Test files: ${{ needs.changes.outputs.tests }}" >> $GITHUB_STEP_SUMMARY
          echo "- Config files: ${{ needs.changes.outputs.config }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To force tests, use workflow_dispatch with force_run=true" >> $GITHUB_STEP_SUMMARY
