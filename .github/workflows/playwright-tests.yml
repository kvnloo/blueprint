name: Playwright E2E Tests

on:
  push:
    branches: [main, dev, feature/*]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: website/src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/src/package-lock.json

      - name: Install test dependencies
        run: npm ci
        working-directory: website

      - name: Install app dependencies
        run: npm ci

      # Specs import @playwright/test from website/node_modules; run that copy's CLI so
      # the runner and the specs share one module instance.
      - name: Install Playwright browsers
        run: npx --prefix .. playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run Playwright tests
        run: npm run test:site
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: .site-shots/test-results/
          retention-days: 30

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: .site-shots/test-results/
          retention-days: 7

  # Quick smoke test for PRs (subset of tests)
  smoke-test:
    name: Smoke Tests (Quick)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: website/src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/src/package-lock.json

      - name: Install test dependencies
        run: npm ci
        working-directory: website

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx --prefix .. playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run smoke tests (site suite, desktop)
        run: npm run test:site -- --project=desktop ../tests/e2e/site.spec.ts
        env:
          CI: true

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test-results
          path: .site-shots/test-results/
          retention-days: 7
